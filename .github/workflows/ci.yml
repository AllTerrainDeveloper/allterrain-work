name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: this workflow only reads the repository to lint, build and
# test. It never writes commits, comments or releases.
permissions:
  contents: read

jobs:
  js:
    name: Types · Vitest · Bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the GITHUB_TOKEN in .git/config; later steps run
          # PR-authored code (npm scripts, the Vite build) and nothing here
          # needs git auth after checkout.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript (no emit)
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      # assets/ is committed on purpose -- the plugin installs straight from a
      # checkout or a zip with no npm install, which is the whole reason the
      # bundles are in version control. That only holds while the committed
      # files match the source: rebuild and fail if the tree moves, which
      # catches a TypeScript change that was never rebuilt.
      - name: Committed bundles match source
        run: |
          npm run build:bundles
          git diff --exit-code -- assets/ || {
            echo "::error::assets/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          }

  php:
    name: PHPUnit · PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # `.wp-env.json` maps this repository and nothing else, so unlike a setup
      # that mounts a sibling OpenStation checkout there is no override to write
      # here. Nothing is lost: the PHPUnit bootstrap stubs the OpenStation
      # functions the plugin calls rather than needing the shell installed.
      - name: Start wp-env
        run: npm run env:start

      - name: Install PHP dev dependencies
        run: npm run test:php:install

      # Resolves to the wp-env backend on its own -- the QA compose project the
      # local path prefers does not exist on a runner. Same command a laptop
      # runs, so a green run here means the same thing.
      - name: PHPUnit
        run: npm run test:php

      - name: Coding standards
        run: npx wp-env run cli --env-cwd=wp-content/plugins/allterrain-work vendor/bin/phpcs

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the bundles
        run: npm run build:bundles

      - name: Start wp-env
        run: npm run env:start

      # The same command that runs locally, so a green run here means the same
      # thing as a green run on a laptop. It installs Plugin Check on first use
      # and fails the job on any finding at severity 5 or above -- the level
      # that fails the WordPress.org review queue.
      - name: Plugin Check
        run: npm run plugin:check
